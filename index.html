<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Tracker</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background-color: #0a0a0a;
      height: 100%;
      overflow: hidden;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .splash-logo {
      width: 64px;
      height: 64px;
      margin-bottom: 24px;
      border-radius: 12px;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .splash-text {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #e5e5e5;
      margin: 0;
    }

    .loading-bar-container {
      width: 160px;
      height: 3px;
      background: #262626;
      border-radius: 4px;
      margin-top: 24px;
      overflow: hidden;
    }

    .loading-bar {
      height: 100%;
      width: 100%;
      background: #e5e5e5;
      transform-origin: left;
      animation: load 0.4s ease-out forwards;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    @keyframes load {
      0% {
        transform: scaleX(0);
      }

      100% {
        transform: scaleX(1);
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="splash-container">
      <img src="/src/assets/logo.png" alt="Logo" class="splash-logo" />
      <h1 class="splash-text">Portfolio Tracker</h1>
      <div class="loading-bar-container">
        <div class="loading-bar"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
